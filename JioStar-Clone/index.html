<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <title>JioStar Clone - Tailwind CSS | TechGuy 360</title>
</head>

<body class="bg-gray-100 text-gray-800">

  <!-- Navbar -->
  <nav class="bg-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-indigo-600">Blog<Span class="text-white bg-orange-500 px-1 py-1 rounded">Wave</Span></h1>
      <input id="searchInput" type="text" placeholder="Search blogs..."
        class="border px-3 py-2 rounded-full w-64 focus:outline-none focus:ring-2 focus:ring-indigo-500">

        <button id="LoginBtn" class="ml-2 bg-indigo-600 text-white px-4 py-2 rounded-full cursor-pointer">Login</button>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="bg-indigo-600 text-white text-center py-16">
    <h2 class="text-4xl font-bold mb-4">Welcome to TechBlog</h2>
    <p class="text-lg">Explore modern web development & programming insights</p>
  </section>

  <!-- Category Filter -->
  <div class="max-w-6xl mx-auto px-4 py-6 flex gap-4 flex-wrap">
    <button class="category-btn bg-indigo-600 text-white px-4 py-2 rounded" data-category="All">All</button>
    <button class="category-btn bg-gray-200 px-4 py-2 rounded" data-category="JavaScript">JavaScript</button>
    <button class="category-btn bg-gray-200 px-4 py-2 rounded" data-category="CSS">CSS</button>
    <button class="category-btn bg-gray-200 px-4 py-2 rounded" data-category="Backend">Backend</button>
  </div>

  <!-- Blog Container -->
  <div id="blogContainer"
    class="max-w-6xl mx-auto px-4 pb-16 grid md:grid-cols-3 gap-8">
  </div>

  <!-- Blog Modal -->
  <div id="blogModal"
    class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center">

    <div class="bg-white max-w-2xl p-6 rounded shadow-lg relative">
      <button id="closeModal"
        class="absolute top-2 right-2 text-gray-600 text-xl">&times;</button>
      <h2 id="modalTitle" class="text-2xl font-bold mb-4"></h2>
      <p id="modalContent"></p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white text-center py-6">
    <p>© 2026 TechBlog. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
