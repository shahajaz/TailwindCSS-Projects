<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <title>Subscription Card | Tech Guy 360</title>
</head>
<body>
    <div>
        <div class="flex flex-col items-center justify-center min-h-screen bg-gray-100">
            <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-sm">
                <h2 class="bg-amber-950 p-2 text-white rounded-lg text-2xl font-bold mb-4 text-center">Choose Your Plan</h2>
                <div class="mb-4">
                    <h3 class="text-xl font-semibold mb-2">Basic Plan</h3>
                    <p class="text-gray-600 mb-2">Perfect for individuals starting out.</p>
                    <p class="text-gray-800 font-bold text-lg">$9.99/month</p>
                </div>
                <div class="mb-4">
                    <h3 class="text-xl font-semibold mb-2">Pro Plan</h3>
                    <p class="text-gray-600 mb-2">Ideal for professionals and small teams.</p>
                    <p class="text-gray-800 font-bold text-lg">$19.99/month</p>
                </div>
                <div>
                    <h3 class="text-xl font-semibold mb-2">Enterprise Plan</h3>
                    <p class="text-gray-600 mb-2">Best for large organizations with advanced needs.</p>
                    <p class="text-gray-800 font-bold text-lg">$49.99/month</p>
                </div>
                <button class="mt-6 w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-900 transition duration-300 cursor-pointer">Subscribe Now</button>
            </div>
        </div>  
    </div>
</body>
</html>
