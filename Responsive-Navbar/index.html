<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Navbar | TechGuy 360</title>
    <link rel="stylesheet" href="./src/output.css" />
</head>
<body class="bg-gray-100">
    
    <!-- Navbar -->
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                
                <div class="flex-shrink-0">
                    <a href="#" class="text-2xl font-bold text-orange-700">
                        ShopShow
                    </a>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-6 font-medium">
                    <a href="#" class="text-black hover:text-orange-700">Home</a>
                    <a href="#" class="text-black hover:text-orange-700">Products</a>
                    <a href="#" class="text-black hover:text-orange-700">Services</a>
                    <a href="#" class="text-black hover:text-orange-700">About Us</a>
                    <a href="#" class="text-black hover:text-orange-700">Contact Us</a>
                </div>
                
                <!-- Mobile Menu Button -->
                <div class="md:hidden">
                    <button id="menu-btn" class="text-black focus:outline-none cursor-pointer">
                        
                        <!-- Hamburger Icon -->
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t">
            <a href="#" class="block px-4 py-2 text-black hover:bg-green-100">Home</a>
            <a href="#" class="block px-4 py-2 text-black hover:bg-green-100">Products</a>
            <a href="#" class="block px-4 py-2 text-black hover:bg-green-100">Services</a>
            <a href="#" class="block px-4 py-2 text-black hover:bg-green-100">About Us</a>
            <a href="#" class="block px-4 py-2 text-black hover:bg-green-100">Contact Us</a>
        </div>
    </nav>

    <!-- JS for Toggle -->
    <script>
        const menuBtn = document.getElementById("menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");

        menuBtn.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
    });
    </script>

</body>
</html>
